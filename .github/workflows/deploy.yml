name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Share images (public/og/) are generated before the build and not committed; keeping them
      # between runs means only dinosaurs whose cover changed are redone.
      - uses: actions/cache@v4
        with:
          path: public/og
          key: og-${{ hashFiles('data/ai-images.json', 'data/dinosaurs.json', 'scripts/build-og-images.ts') }}
          restore-keys: og-

      - run: npm run build

      - name: Deploy with Wrangler
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
